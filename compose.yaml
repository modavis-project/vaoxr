services:
  vaoxr:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaoxr:0.1.0
    container_name: vaoxr
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    external: true
    name: npm_default
